<!DOCTYPE html>
<html lang="en">
  <head>
    <title>EduScope Malaysia - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap"
    />
    <style>
      :root {
        --color-surface: #0F1215;
        --color-on-surface: #F8FAFC;
        --color-secondary: #0DA29F;
        --font-family-heading: "Merriweather", serif;
        --font-family-body: "Open Sans", sans-serif;
        --font-size-3xl: clamp(2.2rem, 2rem + 1.2vw, 2.6rem);
        --font-size-lg: clamp(1.125rem, 1.05rem + 0.32vw, 1.25rem);
        --font-weight-heading: 700;
        --line-height-heading: 1.25;
        --letter-spacing-heading: 0.01em;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: var(--color-surface);
        color: var(--color-on-surface);
        font-family: var(--font-family-body);
        text-align: center;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      .splash-title {
        font-family: var(--font-family-heading);
        font-size: var(--font-size-3xl);
        font-weight: var(--font-weight-heading);
        line-height: var(--line-height-heading);
        letter-spacing: var(--letter-spacing-heading);
      }

      .splash-sub {
        font-family: var(--font-family-heading);
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-heading);
        opacity: 0.85;
        color: var(--color-secondary);
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <p class="splash-title">Please wait to be directed to the webpage</p>
      <p class="splash-sub">Redirecting in <span id="countdown">5</span>...</p>
    </div>
    <script>
      var seconds = 5;
      var el = document.getElementById('countdown');
      var interval = setInterval(function () {
        seconds--;
        el.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = 'local-vs-international-schools.html';
        }
      }, 1000);
    </script>
  </body>
</html>
